<section class="hero" aria-labelledby="hero-heading">
  <div class="hero__avatar-wrapper">
    @for (ring of orbitRingCount; track ring) {
      <span
        class="hero__orbit-ring hero__orbit-ring--{{ ring }}"
        data-testid="hero-orbit-ring"
        aria-hidden="true"
      ></span>
    }
    <picture>
      <source srcset="assets/images/smallProfile.webp" type="image/webp" />
      <img
        class="hero__avatar"
        data-testid="hero-avatar"
        src="assets/images/smallProfile.jpg"
        alt="Portrait of Jarren Bess"
        width="144"
        height="144"
      />
    </picture>
  </div>

  <h1 id="hero-heading" class="hero__name">
    <span data-cursor-hover>Jarren Bess</span>
  </h1>

  <p class="hero__role-line">
    <span
      class="hero__role"
      data-cursor-hover
      data-testid="hero-role"
      appTypingAnimation
      [strings]="roleStrings"
    ></span>
    <span class="hero__role-label" data-cursor-hover>Developer</span>
  </p>

  <div class="hero__actions">
    <a
      class="hero__button hero__button--primary"
      data-testid="hero-contact-button"
      routerLink="/"
      fragment="contact"
    >
      Get in touch
    </a>
    <a
      class="hero__button hero__button--secondary"
      data-testid="hero-resume-button"
      href="docs/Jarren_Bess_Resume.pdf"
      target="_blank"
      rel="noopener noreferrer"
    >
      Resume
    </a>
  </div>
</section>
