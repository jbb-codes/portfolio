<section class="hero" aria-labelledby="hero-heading">
  <div class="hero__avatar-wrapper">
    @for (ring of orbitRings; track ring) {
      <span
        class="hero__orbit-ring hero__orbit-ring--{{ ring }}"
        data-testid="hero-orbit-ring"
        aria-hidden="true"
      ></span>
    }
    <picture>
      <source srcset="assets/images/smallProfile.webp" type="image/webp" />
      <img
        class="hero__avatar"
        data-testid="hero-avatar"
        src="assets/images/smallProfile.jpg"
        alt="Portrait of Jarren Bess"
        width="308"
        height="308"
        fetchpriority="high"
      />
    </picture>
    @for (orbit of orbitDots; track orbit.name) {
      <div
        class="hero__orbit hero__orbit--{{ orbit.name }}"
        [class.hero__orbit--expanded]="expandedOrbit() === orbit.name"
      >
        <div class="hero__orbit-slot">
          <button
            type="button"
            class="hero__orbit-dot"
            data-orbit-dot
            [attr.data-testid]="'hero-orbit-dot-' + orbit.name"
            [attr.aria-label]="orbit.label"
            [attr.aria-expanded]="expandedOrbit() === orbit.name"
            (pointerenter)="onPointerEnter(orbit.name, $event)"
            (pointerleave)="onPointerLeave(orbit.name, $event)"
            (pointerdown)="onPointerDown($event)"
            (focus)="onFocus(orbit.name)"
            (blur)="onBlur(orbit.name)"
            (click)="onClick(orbit.name)"
            (keydown.escape)="onEscape()"
          >
            <span class="hero__dot" aria-hidden="true"></span>
            <span
              class="hero__orbit-label"
              aria-hidden="true"
              [attr.data-testid]="'hero-orbit-label-' + orbit.name"
              >{{ orbit.label }}</span
            >
          </button>
        </div>
      </div>
    }
  </div>

  <h1 id="hero-heading" class="hero__heading">
    <span class="hero__greeting" data-testid="hero-greeting">Hi, I'm</span>
    <span class="hero__name" data-testid="hero-name" data-cursor-hover
      >Jarren Bess</span
    >
  </h1>

  <p class="hero__role-line" data-testid="hero-role-line">
    <span
      class="hero__role"
      data-cursor-hover
      data-testid="hero-role"
      appTypingAnimation
      [strings]="roleStrings"
    ></span
    >&ngsp;<span class="hero__role-label" data-cursor-hover>Developer</span>
  </p>

  <div class="hero__actions">
    <a
      class="hero__button hero__button--primary"
      data-testid="hero-contact-button"
      routerLink="/"
      fragment="contact"
    >
      Get in touch
    </a>
    <a
      class="hero__button hero__button--secondary"
      data-testid="hero-resume-button"
      href="docs/Jarren_Bess_Resume.pdf"
      target="_blank"
      rel="noopener noreferrer"
    >
      Resume
    </a>
  </div>
</section>
