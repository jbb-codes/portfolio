<nav class="navbar" aria-label="Main navigation">
  <a class="navbar__brand" data-testid="navbar-brand" routerLink="/"
    >Jarren Bess</a
  >
  <ul class="navbar__links" data-testid="navbar-links">
    <li>
      <a
        class="navbar__link"
        data-testid="navbar-link"
        routerLink="/"
        fragment="about"
        >About</a
      >
    </li>
    <li>
      <a
        class="navbar__link"
        data-testid="navbar-link"
        routerLink="/"
        fragment="work"
        >Work</a
      >
    </li>
    <li>
      <a
        class="navbar__link"
        data-testid="navbar-link"
        routerLink="/"
        fragment="stack"
        >Stack</a
      >
    </li>
    <li>
      <a
        class="navbar__link"
        data-testid="navbar-link"
        routerLink="/"
        fragment="bucket-list"
        >Bucket List</a
      >
    </li>
  </ul>
  <button
    class="navbar__theme-toggle"
    data-testid="theme-toggle"
    (click)="themeService.toggle()"
    [class.is-animating]="isAnimating()"
    (animationend)="themeService.clearAnimation()"
    [attr.aria-label]="
      isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'
    "
  >
    @if (isDarkMode()) {
      <svg lucideSun [size]="18"></svg>
    } @else {
      <svg lucideMoon [size]="18"></svg>
    }
  </button>
</nav>
